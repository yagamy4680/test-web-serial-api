<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Serial uCOBS Terminal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <style>
        .terminal-container {
            background-color: #000;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            height: 400px;
        }
        .hex-input {
            font-family: 'Courier New', monospace;
            background-color: #f8f9fa;
        }
        .status-badge {
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-3">Web Serial uCOBS Terminal</h1>
            </div>
        </div>
        
        <!-- Connection Panel -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Serial Port Connection</h5>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <button id="connectBtn" class="btn btn-primary">Connect to Serial Port</button>
                                <button id="disconnectBtn" class="btn btn-secondary ms-2" disabled>Disconnect</button>
                            </div>
                            <div class="col-auto">
                                <span id="connectionStatus" class="badge bg-secondary status-badge">Disconnected</span>
                            </div>
                            <div class="col-auto">
                                <label class="form-label mb-0 me-2">Baud Rate:</label>
                                <select id="baudRate" class="form-select" style="width: auto; display: inline-block;">
                                    <option value="9600">9600</option>
                                    <option value="19200">19200</option>
                                    <option value="38400">38400</option>
                                    <option value="57600">57600</option>
                                    <option value="115200" selected>115200</option>
                                    <option value="230400">230400</option>
                                    <option value="460800">460800</option>
                                    <option value="921600">921600</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminal and Controls -->
        <div class="row">
            <!-- Terminal -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">Serial Terminal (uCOBS Stream)</h6>
                        <button id="clearTerminal" class="btn btn-sm btn-outline-secondary">Clear Terminal</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="terminal" class="terminal-container"></div>
                    </div>
                </div>
            </div>
            
            <!-- Send Data Panel -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">Send Data</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="hexInput" class="form-label">Hex Data (space separated):</label>
                            <textarea id="hexInput" class="form-control hex-input" rows="4" 
                                placeholder="Example: AA BB CC DD 01 02 03 04"></textarea>
                            <div class="form-text">Enter hex bytes separated by spaces</div>
                        </div>
                        <div class="mb-3">
                            <label for="jsonInput" class="form-label">JSON Data (auto-encoded):</label>
                            <textarea id="jsonInput" class="form-control" rows="4" 
                                placeholder='Example: {"sensor": "temperature", "value": 25.3}'></textarea>
                            <div class="form-text">Will be MessagePack encoded and COBS framed</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="sendHexBtn" class="btn btn-success" disabled>Send Hex Data</button>
                            <button id="sendJsonBtn" class="btn btn-info" disabled>Send JSON Data</button>
                        </div>
                    </div>
                </div>
                
                <!-- Statistics -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6 class="mb-0">Statistics</h6>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="h5 mb-0" id="bytesReceived">0</div>
                                <small class="text-muted">Bytes RX</small>
                            </div>
                            <div class="col-6">
                                <div class="h5 mb-0" id="bytesSent">0</div>
                                <small class="text-muted">Bytes TX</small>
                            </div>
                        </div>
                        <hr>
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="h6 mb-0" id="packetsDecoded">0</div>
                                <small class="text-muted">Packets Decoded</small>
                            </div>
                            <div class="col-6">
                                <div class="h6 mb-0" id="packetsSent">0</div>
                                <small class="text-muted">Packets Sent</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
